name: CI

on:
  push:
    # Both names are listed so CI runs regardless of which the repository
    # settles on. Without this, a repo defaulting to `master` never runs CI at
    # all — the checks silently do not exist rather than visibly fail.
    branches: [main, master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Route types (PageProps/LayoutProps) are generated, not committed.
      - run: npx next typegen

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check

      # Includes the hard-constraint guards from plan Appendix B:
      # no Edge runtime, no Vercel-only services, no auth framework with user
      # records, no secrets behind NEXT_PUBLIC_, env docs in sync.
      - run: npm test

      # The flight parser must be timezone-independent. A developer machine in
      # Asia/Almaty (the airport's own zone) hides date-shift bugs that appear
      # instantly on a UTC server — which is what the airport will run.
      - run: npm test
        env:
          TZ: UTC

      - run: npm test
        env:
          TZ: Pacific/Auckland

  e2e:
    name: Production build on plain Node + e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npx playwright install --with-deps chromium

      # Playwright's webServer runs `npm run build && npm start`, i.e. the
      # standalone bundle under plain `node server.js` — the exact command the
      # airport uses. If this job passes, the no-Vercel-lock-in constraint
      # still holds (plan §9.4).
      - run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
